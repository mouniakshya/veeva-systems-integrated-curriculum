<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Registration Page</title>
</head>
<body>
    <h2>User Registration</h2>
    <form id="regForm" onsubmit="event.preventDefault(); document.getElementById('successMsg').style.display='block';">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required><br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required><br><br>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required><br><br>

        <label for="country">Country:</label>
        <select id="country" name="country">
            <option value="">--Select Country--</option>
            <option value="in">India</option>
            <option value="us">United States</option>
            <option value="uk">United Kingdom</option>
        </select><br><br>

        <input type="checkbox" id="terms" name="terms">
        <label for="terms">I agree to the Terms & Conditions</label><br><br>

        <button type="submit" id="submitBtn">Submit</button>
    </form>

    <p id="successMsg" style="display:none; color:green;">Registration Successful!</p>
</body>
</html>
